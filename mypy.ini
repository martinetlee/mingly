# Scoped type gate: only error classes that are always bugs (a renamed
# attribute or column, an undefined name, a wrong call signature). Run by
# build_app.sh; the broader codebase is not fully annotated.
[mypy]
python_version = 3.9
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = True
disable_error_code = annotation-unchecked
enable_error_code =
