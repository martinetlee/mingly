<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Common Defense</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <script>
      // Apply the saved theme before first paint (mirrors src/lib/theme.ts)
      try {
        if (localStorage.getItem('mingly_theme') === 'light') document.documentElement.setAttribute('data-theme', 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
